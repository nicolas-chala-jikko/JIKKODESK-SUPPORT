version: '3.8'
services:
  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '1'
          memory: 1G
    ports:
      - "8000:8000"
  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}
    deploy:
      replicas: 2
    ports:
      - "3000:3000"
