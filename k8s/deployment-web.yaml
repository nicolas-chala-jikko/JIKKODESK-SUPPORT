apiVersion: apps/v1
kind: Deployment
metadata:
  name: zendesk-clone-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zendesk-clone-web
  template:
    metadata:
      labels:
        app: zendesk-clone-web
    spec:
      containers:
      - name: web
        image: zendesk-clone-web:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: https://api.tudominio.com
---
apiVersion: v1
kind: Service
metadata:
  name: zendesk-clone-web
spec:
  selector:
    app: zendesk-clone-web
  ports:
  - port: 3000
    targetPort: 3000
  type: LoadBalancer
