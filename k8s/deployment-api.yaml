apiVersion: apps/v1
kind: Deployment
metadata:
  name: zendesk-clone-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zendesk-clone-api
  template:
    metadata:
      labels:
        app: zendesk-clone-api
    spec:
      containers:
      - name: api
        image: zendesk-clone-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zendesk-clone-secrets
              key: database-url
        - name: REDIS_URL
          value: redis://redis:6379/0
        livenessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /health, port: 8000 }
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: zendesk-clone-api
spec:
  selector:
    app: zendesk-clone-api
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zendesk-clone-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zendesk-clone-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
