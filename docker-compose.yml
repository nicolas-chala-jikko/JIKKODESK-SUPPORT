version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: zendesk_clone
      POSTGRES_USER: zendesk
      POSTGRES_PASSWORD: zendesk123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendesk"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://zendesk:zendesk123@postgres:5432/zendesk_clone
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      - ../zendesk-backup-silin:/backup:ro

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  pgdata:
